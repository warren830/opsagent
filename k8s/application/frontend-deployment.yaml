apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: openops
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        karpenter.sh/nodepool: common-nodepool
      containers:
      - name: frontend
        image: 612674025488.dkr.ecr.us-west-1.amazonaws.com/openops-frontend:latest
        ports:
        - containerPort: 3000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: frontend-config
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: "30m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"

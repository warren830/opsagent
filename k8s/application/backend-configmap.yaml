apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: openops
data:
  # ── Environment ──────────────────────────────
  OPENOPS_ENV: "kolya"
  BACKEND_PORT: "3080"
  RUST_LOG: "openops=info,tower_http=info"

  # ── Database ─────────────────────────────────
  # DATABASE_URL comes from Secret (ESO)
  DB_MAX_CONNECTIONS: "20"
  DB_MIN_CONNECTIONS: "5"

  # ── CORS ─────────────────────────────────────
  ALLOWED_ORIGINS: "https://oops.kolya.fun"

  # ── Claude Code ──────────────────────────────
  CLAUDE_TIMEOUT_MS: "300000"
  CLAUDE_MODEL: "opus"
  CLAUDE_WORK_DIR: "/app/workspace"

  # ── Cognito ──────────────────────────────────
  COGNITO_DOMAIN: "oops-kolya-612674025488"
  COGNITO_REDIRECT_URIS: "https://oops.kolya.fun/auth/cognito/callback"
  MICROSOFT_REDIRECT_URIS: "https://oops.kolya.fun/auth/microsoft/callback"

  # ── AWS ──────────────────────────────────────
  AWS_REGION: "us-west-1"

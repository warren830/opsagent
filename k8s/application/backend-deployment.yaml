apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: openops
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      nodeSelector:
        karpenter.sh/nodepool: common-nodepool
      containers:
      - name: backend
        image: 612674025488.dkr.ecr.us-west-1.amazonaws.com/openops-backend:latest
        ports:
        - containerPort: 3080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: jwt-secret
        - name: COGNITO_USER_POOL_ID
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: cognito-user-pool-id
        - name: COGNITO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: cognito-client-id
        - name: COGNITO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: cognito-client-secret
        - name: COGNITO_REGION
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: cognito-region
        volumeMounts:
        - name: workspace
          mountPath: /app/workspace
        livenessProbe:
          httpGet:
            path: /health
            port: 3080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: "250m"
            memory: "384Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: backend-workspace

name: Frontend CI

# Build-and-verify only. This workflow never deploys and never requests
# cloud credentials — no OIDC role assumption, no secrets are referenced.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 LTS, floor pinned to the version the lockfile was resolved on.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=22.13.0 <23.0.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
